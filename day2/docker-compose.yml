name: day01-lgtm-stack
services:
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "flameGraph traceqlEditor"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--web.enable-remote-write-receiver",
        "--web.enable-lifecycle",
      ]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["3200:3200", "4317", "4318"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml"]

  mimir:
    image: grafana/mimir:2.13.0
    command: ["-config.file=/etc/mimir.yaml", "-target=all"]
    ports: ["9009:9009"]
    volumes:
      [
        "./mimir/mimir.yaml:/etc/mimir.yaml",
        "./mimir/alertmanager-fallback-config.yaml:/etc/alertmanager-fallback-config.yaml",
      ]

  pyroscope:
    image: grafana/pyroscope:1.7.1
    ports: ["4040:4040"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports: ["4317:4317", "4318:4318"] # OTLP gRPC / HTTP (host)
    volumes: ["./otel-collector/config.yaml:/etc/otelcol/config.yaml"]
    depends_on: [tempo, loki, mimir]

  alloy:
    image: grafana/alloy:v1.3.1
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "/etc/alloy/config.alloy",
      ]
    ports: ["12345:12345"]
    volumes: ["./alloy/config.alloy:/etc/alloy/config.alloy"]

  localstack:
    image: localstack/localstack:3.7
    ports: ["4566:4566"]
    environment:
      SERVICES: "sns,sqs,s3"
      DEBUG: "0"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sns list-topics >/dev/null 2>&1 || exit 1"]
      interval: 10s
      retries: 12

  api:
    build: ./api
    ports: ["8080:8080"]
    environment:
      AWS_ENDPOINT: "http://localstack:4566"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      TOPIC_ARN: "arn:aws:sns:us-east-1:000000000000:orders"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "api"
    depends_on: [localstack, otel-collector]

  worker:
    build: ./worker
    environment:
      AWS_ENDPOINT: "http://localstack:4566"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      QUEUE_URL: "http://localstack:4566/000000000000/orders-queue"
      RESULT_BUCKET: "order-results"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "worker"
    depends_on: [localstack, otel-collector]
